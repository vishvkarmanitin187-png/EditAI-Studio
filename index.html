<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditAI Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; padding: 15px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #00d2ff; font-size: 26px; margin-bottom: 5px; }
        p { color: #8b8b9e; font-size: 13px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: linear-gradient(135deg, #1f2833, #0b0c10); border-radius: 12px; padding: 18px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .card:active { transform: scale(0.96); }
        .card:hover { border-color: #66fcf1; }
        .card h3 { color: #66fcf1; font-size: 16px; margin-bottom: 5px; }
        .card p { color: #c5c6c7; font-size: 11px; }

        .workspace { background: #1f2833; border-radius: 12px; padding: 20px; display: none; margin-top: 15px; border: 1px solid #45a29e; }
        .workspace h2 { color: #66fcf1; font-size: 18px; margin-bottom: 12px; }
        
        .btn-back { background: #45a29e; color: #0b0c10; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-action { background: #66fcf1; color: #0b0c10; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
